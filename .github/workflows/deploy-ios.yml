name: Deploy iOS

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy-ios.yml"]
  workflow_dispatch:

concurrency: deploy-ios

permissions:
  contents: read

jobs:
  testflight:
    permissions:
      id-token: write
      contents: read
    uses: willsawyerrrr/platform/.github/workflows/ios-testflight.yml@main
    with:
      scheme: AppIntentsFactory
      project-dir: app
    secrets:
      OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}
