name: AppIntentsSpike
options:
  bundleIdPrefix: dev.willsawyerrrr
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 8558CXPT9G
    CODE_SIGN_STYLE: Automatic
targets:
  AppIntentsSpike:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Scripts
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Intents Spike
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.AppIntentsSpike
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
